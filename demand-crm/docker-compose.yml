# Local development: PostgreSQL + API + web, with live reload.
#   docker compose up --build
#   docker compose run --rm api python -m scripts.bootstrap     (first time only)
# Then open http://localhost:5173

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:crm@db:5432/crm
      TEST_DATABASE_URL: postgresql+asyncpg://crm:crm@db:5432/crm_test
      STORAGE_ROOT: /srv/storage
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/srv/app/app
      - ./backend/alembic:/srv/app/alembic
      - ./backend/tests:/srv/app/tests
      - ./backend/scripts:/srv/app/scripts
      - ./storage:/srv/storage
    depends_on:
      db:
        condition: service_healthy

  # Runs the AI jobs (letter generation) so they finish even if the browser is closed.
  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:crm@db:5432/crm
      STORAGE_ROOT: /srv/storage
    command: python -m app.worker
    volumes:
      - ./backend/app:/srv/app/app
      - ./storage:/srv/storage
    depends_on:
      api:
        condition: service_started

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/srv/web/src
      - ./frontend/index.html:/srv/web/index.html
    depends_on:
      - api

volumes:
  pgdata:
