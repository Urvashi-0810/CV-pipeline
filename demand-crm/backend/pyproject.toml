[project]
name = "demand-crm-backend"
version = "0.1.0"
description = "Demand Letter CRM - backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<1.0",
    "alembic>=1.20,<2.0",
    "pydantic-settings>=2.15,<3.0",
    "argon2-cffi>=25.1,<26.0",
    "openpyxl>=3.1,<4.0",
    "python-multipart>=0.0.20",
    "anthropic>=1.13,<2.0",
    "google-genai>=2.29,<3.0",
    "python-docx>=1.2,<2.0",
    "pypdf>=6.0,<7.0",
    "pillow>=12.0,<13.0",
    "pypdfium2>=5.0,<6.0",
    "cryptography>=45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "httpx>=0.28,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
